<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; font: 13px/1.5 "Segoe UI", system-ui, sans-serif; margin: 0; padding: 14px; color: #e9ebf0; background: #111; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    h1 span { color: #ff6a00; }
    label { display: block; font-size: 11px; color: #9ca3af; margin: 8px 0 3px; text-transform: uppercase; letter-spacing: .04em; }
    input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #2c2c2c; border-radius: 8px; font: inherit; background: #161616; color: #fff; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 9px; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; }
    #start { background: #ff6a00; color: #fff; }
    #stop { background: #1e222b; color: #dce0e8; border: 1px solid #2c2c2c; }
    #save { width: 100%; margin-top: 10px; padding: 8px; background: #1e222b; color: #dce0e8; border: 1px solid #2c2c2c; border-radius: 8px; font-weight: 600; cursor: pointer; }
    #status { margin-top: 12px; font-size: 12px; color: #dce0e8; white-space: pre-wrap; min-height: 18px; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; background:#9ca3af; }
    .dot.on { background:#22c55e; }
    .hint { font-size: 11px; color: #9ca3af; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Clip Bot <span>Auto Harvester</span></h1>
  <label>Backend URL (เว็บแอป)</label>
  <input id="url" placeholder="http://127.0.0.1:8110" />
  <label>Token (ถ้า deploy ขึ้นเซิร์ฟเวอร์)</label>
  <input id="token" placeholder="เว้นว่างถ้ารันในเครื่อง" />
  <label>จำนวนหน้ารีวิวต่อสินค้า (maxPages)</label>
  <input id="pages" type="number" min="1" max="100" value="10" />
  <label>เก็บทุก ๆ (เว้นช่วงระหว่างสินค้า)</label>
  <div style="display:flex;gap:8px">
    <input id="interval" type="number" min="0" value="0" style="flex:2" />
    <select id="unit" style="flex:1;padding:7px;border-radius:8px;background:#161616;color:#fff;border:1px solid #2c2c2c">
      <option value="min">นาที</option>
      <option value="hr">ชั่วโมง</option>
    </select>
  </div>
  <button id="save">บันทึกการตั้งค่า</button>
  <div class="row">
    <button id="start">▶ เริ่ม</button>
    <button id="stop">⏹ หยุด</button>
  </div>
  <div id="status"><span class="dot" id="dot"></span><span id="statusText">—</span></div>
  <div class="hint">ไม่ต้องใส่ token — ใส่คิวสินค้าที่ Dashboard เว็บแอป (แท็บ 🧲 เก็บรีวิว) แล้วกดเริ่ม ระบบจะพาแท็บไปหน้ารีวิว Shopee เก็บให้อัตโนมัติ · เว้นช่วง 0 = เก็บต่อเนื่องรัว ๆ, ตั้งเลข = เว้นเวลาระหว่างสินค้า (กัน rate-limit)</div>
  <script src="popup.js"></script>
</body>
</html>
