<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111d"/>
      <stop offset="1" stop-color="#101f31"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff543e"/>
      <stop offset="1" stop-color="#c7192c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7890aa"/>
    </marker>
    <style>
      text { font-family: "Leelawadee UI", Tahoma, sans-serif; fill: #f5f8fc; }
      .title { font-size: 64px; font-weight: 700; }
      .subtitle { font-size: 26px; fill: #aebdd0; }
      .section { font-size: 32px; font-weight: 700; }
      .node { fill: #142437; stroke: #2c435d; stroke-width: 3; filter: url(#shadow); }
      .node-ai { fill: #173147; stroke: #2bbbd8; }
      .node-flow { fill: #282237; stroke: #ac7cf2; }
      .node-file { fill: #17322d; stroke: #4bd19a; }
      .node-warn { fill: #362d18; stroke: #f2bd4a; }
      .node-stop { fill: #391e26; stroke: #ff5a67; }
      .node-brand { fill: url(#brand); stroke: #ff806d; }
      .label { font-size: 26px; font-weight: 650; text-anchor: middle; }
      .small { font-size: 21px; fill: #c2cfdd; text-anchor: middle; }
      .step { font-size: 18px; font-weight: 700; fill: #08111d; text-anchor: middle; }
      .step-circle { fill: #d9e3ef; }
      .arrow { fill: none; stroke: #7890aa; stroke-width: 5; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #f2bd4a; stroke-width: 5; marker-end: url(#arrow); }
      .danger { fill: none; stroke: #ff5a67; stroke-width: 5; marker-end: url(#arrow); }
      .yesno { font-size: 20px; font-weight: 700; }
      .legend { font-size: 21px; fill: #aebdd0; }
    </style>
  </defs>

  <rect width="2400" height="1700" fill="url(#bg)"/>
  <rect x="0" y="0" width="2400" height="18" fill="url(#brand)"/>

  <g transform="translate(100 78)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#brand)"/>
    <path d="M23 18 L56 36 L23 55 Z" fill="#101b2a"/>
    <text x="92" y="51" class="title">ClipForge — Flow การทำงานของบอท</text>
    <text x="94" y="91" class="subtitle">สร้างภาพสินค้า → สร้างคลิปต่อเนื่อง → พากย์เสียง → ประกอบวิดีโออัตโนมัติ</text>
  </g>

  <text x="100" y="235" class="section">A. ขั้นตอนการผลิตวิดีโอ</text>

  <!-- Row 1 -->
  <g transform="translate(100 280)">
    <rect width="310" height="180" rx="28" class="node-brand"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">1</text>
    <text x="155" y="78" class="label">เริ่มบอท</text>
    <text x="155" y="116" class="small">เลือก 16 หรือ 24 วินาที</text>
    <text x="155" y="148" class="small">2 คลิป / 3 คลิป</text>
  </g>
  <g transform="translate(475 280)">
    <rect width="310" height="180" rx="28" class="node"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">2</text>
    <text x="155" y="78" class="label">เลือกสินค้า</text>
    <text x="155" y="116" class="small">สุ่มอัตโนมัติ</text>
    <text x="155" y="148" class="small">หรือผู้ใช้เลือกเอง</text>
  </g>
  <g transform="translate(850 280)">
    <rect width="310" height="180" rx="28" class="node-ai"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">3</text>
    <text x="155" y="72" class="label">Gemini วิเคราะห์</text>
    <text x="155" y="110" class="small">ข้อมูล + รูปสินค้า</text>
    <text x="155" y="142" class="small">Storyboard + Motion Prompt</text>
  </g>
  <g transform="translate(1225 280)">
    <rect width="310" height="180" rx="28" class="node-flow"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">4</text>
    <text x="155" y="78" class="label">เปิด Google Flow</text>
    <text x="155" y="116" class="small">สร้างโปรเจกต์ใหม่</text>
    <text x="155" y="148" class="small">ตั้งภาพแนวตั้ง 9:16</text>
  </g>
  <g transform="translate(1600 280)">
    <rect width="310" height="180" rx="28" class="node-flow"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">5</text>
    <text x="155" y="72" class="label">เจนภาพตั้งต้น</text>
    <text x="155" y="110" class="small">อัปโหลดรูปสินค้า</text>
    <text x="155" y="142" class="small">พิมพ์ Prompt ทีละตัว 200ms</text>
  </g>
  <g transform="translate(1975 280)">
    <rect width="310" height="180" rx="28" class="node-file"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">6</text>
    <text x="155" y="72" class="label">บันทึกภาพ</text>
    <text x="155" y="110" class="small">ตรวจพบและดาวน์โหลด</text>
    <text x="155" y="142" class="small">พักสุ่ม 1–3 นาที</text>
  </g>

  <path d="M410 370 H465" class="arrow"/>
  <path d="M785 370 H840" class="arrow"/>
  <path d="M1160 370 H1215" class="arrow"/>
  <path d="M1535 370 H1590" class="arrow"/>
  <path d="M1910 370 H1965" class="arrow"/>

  <!-- Row 2, right to left -->
  <g transform="translate(1975 555)">
    <rect width="310" height="180" rx="28" class="node-flow"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">7</text>
    <text x="155" y="70" class="label">ตั้งค่าวิดีโอ</text>
    <text x="155" y="108" class="small">Frames · Omni Flash</text>
    <text x="155" y="140" class="small">9:16 · 1x · 8 วินาที</text>
  </g>
  <g transform="translate(1600 555)">
    <rect width="310" height="180" rx="28" class="node-flow"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">8</text>
    <text x="155" y="72" class="label">ใส่ Start frame</text>
    <text x="155" y="110" class="small">คลิปแรก: ภาพตั้งต้น</text>
    <text x="155" y="142" class="small">คลิปถัดไป: เฟรมท้ายเดิม</text>
  </g>
  <g transform="translate(1225 555)">
    <rect width="310" height="180" rx="28" class="node-flow"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">9</text>
    <text x="155" y="72" class="label">พิมพ์ Motion Prompt</text>
    <text x="155" y="110" class="small">ทีละตัวอักษร</text>
    <text x="155" y="142" class="small">หน่วง 200ms ต่อตัว</text>
  </g>
  <g transform="translate(850 555)">
    <rect width="310" height="180" rx="28" class="node-warn"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">10</text>
    <text x="155" y="72" class="label">Generate + เฝ้าผล</text>
    <text x="155" y="110" class="small">ไม่กดซ้ำระหว่างรอ</text>
    <text x="155" y="142" class="small">แยกสถานะชั่วคราว/จริง</text>
  </g>
  <g transform="translate(475 555)">
    <rect width="310" height="180" rx="28" class="node-file"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">11</text>
    <text x="155" y="72" class="label">ดาวน์โหลดคลิป</text>
    <text x="155" y="110" class="small">บันทึก Checkpoint</text>
    <text x="155" y="142" class="small">พักสุ่ม 1–3 นาที</text>
  </g>
  <g transform="translate(100 555)">
    <rect width="310" height="180" rx="28" class="node"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">12</text>
    <text x="155" y="72" class="label">ครบทุกคลิป?</text>
    <text x="155" y="110" class="small">ไม่ครบ → ใช้เฟรมท้าย</text>
    <text x="155" y="142" class="small">แล้ววนกลับขั้น 7</text>
  </g>

  <path d="M2130 460 V545" class="arrow"/>
  <path d="M1975 645 H1920" class="arrow"/>
  <path d="M1600 645 H1545" class="arrow"/>
  <path d="M1225 645 H1170" class="arrow"/>
  <path d="M850 645 H795" class="arrow"/>
  <path d="M475 645 H420" class="arrow"/>

  <!-- Row 3 -->
  <g transform="translate(100 830)">
    <rect width="390" height="180" rx="28" class="node-ai"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">13</text>
    <text x="195" y="70" class="label">Gemini ดูคลิปจริง</text>
    <text x="195" y="108" class="small">เขียนบทตามภาพแต่ละช็อต</text>
    <text x="195" y="140" class="small">ตรวจบทขายของและความยาว</text>
  </g>
  <g transform="translate(570 830)">
    <rect width="390" height="180" rx="28" class="node-ai"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">14</text>
    <text x="195" y="70" class="label">สร้างเสียงพากย์</text>
    <text x="195" y="108" class="small">TTS + จัดจังหวะเสียง</text>
    <text x="195" y="140" class="small">Fallback หากเสียงสั้นเกินไป</text>
  </g>
  <g transform="translate(1040 830)">
    <rect width="390" height="180" rx="28" class="node-file"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">15</text>
    <text x="195" y="70" class="label">FFmpeg ประกอบงาน</text>
    <text x="195" y="108" class="small">คลิป + เสียง + ซับ</text>
    <text x="195" y="140" class="small">แนวตั้ง 720 × 1280</text>
  </g>
  <g transform="translate(1510 830)">
    <rect width="390" height="180" rx="28" class="node-brand"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">16</text>
    <text x="195" y="70" class="label">Final Video</text>
    <text x="195" y="108" class="small">ตรวจไฟล์และบันทึกผลลัพธ์</text>
    <text x="195" y="140" class="small">job_[id]_final.mp4</text>
  </g>
  <g transform="translate(1980 830)">
    <rect width="305" height="180" rx="28" class="node"/>
    <circle cx="38" cy="38" r="22" class="step-circle"/><text x="38" y="45" class="step">17</text>
    <text x="152" y="70" class="label">งานถัดไป</text>
    <text x="152" y="108" class="small">พักสุ่ม 1–3 นาที</text>
    <text x="152" y="140" class="small">แล้วสุ่มสินค้าใหม่</text>
  </g>

  <path d="M255 735 V820" class="arrow"/>
  <path d="M490 920 H560" class="arrow"/>
  <path d="M960 920 H1030" class="arrow"/>
  <path d="M1430 920 H1500" class="arrow"/>
  <path d="M1900 920 H1970" class="arrow"/>

  <!-- Error recovery -->
  <rect x="70" y="1110" width="2260" height="470" rx="38" fill="#0d1928" stroke="#2c435d" stroke-width="3"/>
  <text x="110" y="1175" class="section">B. การจัดการ Error และการป้องกันเครดิต</text>

  <g transform="translate(110 1230)">
    <rect width="330" height="190" rx="28" class="node-warn"/>
    <text x="165" y="72" class="label">พบ Error</text>
    <text x="165" y="112" class="small">ตรวจชนิดข้อความ</text>
    <text x="165" y="146" class="small">ก่อนดำเนินการต่อ</text>
  </g>
  <g transform="translate(550 1200)">
    <rect width="360" height="160" rx="28" class="node-stop"/>
    <text x="180" y="58" class="label">กิจกรรมผิดปกติ</text>
    <text x="180" y="98" class="small">หยุดทันที + ล็อกเครดิต</text>
    <text x="180" y="130" class="small">ไม่ Retry อัตโนมัติ</text>
  </g>
  <g transform="translate(550 1400)">
    <rect width="360" height="130" rx="28" class="node-warn"/>
    <text x="180" y="52" class="label">Error ทั่วไป</text>
    <text x="180" y="92" class="small">Retry ปุ่มที่ยืนยันได้ 3 รอบ</text>
  </g>
  <g transform="translate(1030 1400)">
    <rect width="360" height="130" rx="28" class="node-warn"/>
    <text x="180" y="52" class="label">ยังไม่สำเร็จ</text>
    <text x="180" y="92" class="small">พัก 20 นาที แล้วรันงานเดิม</text>
  </g>
  <g transform="translate(1510 1400)">
    <rect width="360" height="130" rx="28" class="node-warn"/>
    <text x="180" y="52" class="label">โหมดระวัง</text>
    <text x="180" y="92" class="small">เพิ่มคูลดาวเป็น 2–6 นาที</text>
  </g>
  <g transform="translate(1990 1400)">
    <rect width="300" height="130" rx="28" class="node-stop"/>
    <text x="150" y="52" class="label">Error ซ้ำ</text>
    <text x="150" y="92" class="small">พัก 24 ชม. แล้วเริ่มใหม่</text>
  </g>

  <path d="M440 1325 H520 V1280 H540" class="danger"/>
  <text x="485" y="1260" class="yesno" fill="#ff7e89">ใช่</text>
  <path d="M440 1325 H500 V1465 H540" class="branch"/>
  <text x="468" y="1445" class="yesno" fill="#f2bd4a">ไม่ใช่</text>
  <path d="M910 1465 H1020" class="branch"/>
  <path d="M1390 1465 H1500" class="branch"/>
  <path d="M1870 1465 H1980" class="danger"/>

  <text x="110" y="1640" class="legend">ClipForge 2.6.29 · คูลดาวปกติ 1–3 นาที · Prompt typing 200ms/ตัวอักษร · 16 วินาที = 2 คลิป · 24 วินาที = 3 คลิป</text>
</svg>
